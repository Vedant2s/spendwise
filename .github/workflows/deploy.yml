name: SpendWise CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run Maven tests
        working-directory: spendwise
        run: mvn clean test


  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    # Deployment only happens if test job passes
    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}/spendwise
          dockerfilePath: Dockerfile

          acrName: ${{ vars.ACR_NAME }}

          containerAppName: ${{ vars.CONTAINER_APP_NAME }}

          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}

          imageToBuild: ${{ vars.ACR_NAME }}.azurecr.io/spendwise:${{ github.sha }}
